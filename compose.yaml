# Pester as a Dockge (or plain `docker compose`) stack. Paste this into a new Dockge stack.
#
# `:latest` is the newest release; Dockge's Update button pulls it. Pin a version (e.g. `:0.1.0`) to upgrade
# on your own schedule, or use `:main` to follow every merged change. Images are published for amd64 and
# arm64. To build from source instead, replace `image:` with
# `build: https://github.com/mbmackenzie/pester.git#main`.
#
# Keep port 8000 on your LAN: the admin UI is not meant for the internet. Pester only needs outbound
# access (your LLM provider and your messaging channels).
#
# After deploying, open http://<server>:8000/admin (the setup code is in the logs) and follow
# docs/deploy.md. Configuration lives in the database in ./data; manage it in the admin UI or with
# `docker compose exec pester pester --help`.

services:
  pester:
    image: ghcr.io/mbmackenzie/pester:latest
    container_name: pester
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data   # the SQLite database: config, jobs, and history. Back up this directory.
    environment:
      PESTER_LOG_FORMAT: text   # or json
      # Secrets can be set here instead of in the database; these take precedence:
      # OPENAI_API_KEY: sk-...
      # Optional: seed an empty database from a YAML file (see config.example.yaml):
      # PESTER_CONFIG: /data/config.yaml
