[project]
name = "pester"
version = "0.1.0"
description = "Generic asynchronous human-interaction runtime: jobs in, humans bothered, responses evaluated, events out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[project.scripts]
pester = "pester:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
